name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter api exec tsc --noEmit
      - run: pnpm --filter api exec jest --runInBand
      - run: pnpm --filter api build
      - run: node --test packages/outbound-network/test/network.test.cjs
      - run: node packages/outbound-network/build.mjs --check
      - run: node scripts/security/test-uazapi-egress.mjs
      - run: pnpm --filter web build
        env:
          NITRO_PRESET: node-server
      # Application test processes receive only loopback URLs and synthetic keys.
      - run: pnpm test:security-http
      - run: node scripts/security/test-web-egress.mjs
      - run: node scripts/security/test-security-headers.mjs
      - run: node scripts/security/test-backend-streaming.mjs
      - run: node scripts/security/test-auth-session-http.mjs
      - run: node scripts/security/test-browser-session.mjs
      - run: node scripts/security/test-mail-compatibility.mjs
      - run: node scripts/security/test-mail-tls.mjs
      - name: Edge handlers without runtime network or environment access
        run: pnpm dlx --allow-build=deno deno@2.9.6 test --no-config --no-lock --node-modules-dir=manual --no-prompt --deny-net --deny-env supabase/functions/*/handler.test.ts
      - run: pnpm test:security-lint
      - run: pnpm lint:security
      - run: pnpm --filter api exec eslint 'src/**/*.ts' 'test/**/*.ts'
      # Existing style violations remain visible and block this check until fixed.
      - run: pnpm --filter web lint

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high --json > "$RUNNER_TEMP/audit.json"
      - if: always()
        run: node scripts/security/test-dependency-audit.mjs "$RUNNER_TEMP/audit.json"

  session-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Scoped contract fixture; the full historical SQL/RLS matrix is separate.
      - run: python3 scripts/security/run-session-isolation.py

  full-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/security/run-full-sql.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner --log-level=error'
