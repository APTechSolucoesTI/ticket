packages:
  - "apps/*"
  - "packages/*"
overrides:
  deepmerge-ts: 8.0.2
  fast-uri: 3.1.6
  js-yaml: 4.3.2
  multer: 2.4.0
  nodemailer: 9.1.1
  qs: 6.16.0
allowBuilds:
  # bullmq's anonymous-usage telemetry postinstall ping - no functional need, denied.
  '@scarf/scarf': false
  # core-js postinstall only prints project funding information; runtime build is unnecessary.
  core-js: false
  # native msgpack encoder used by ioredis for faster (de)serialization.
  msgpackr-extract: true
  # native module resolver used by jest - real perf benefit, from Jest's own toolchain.
  unrs-resolver: true
