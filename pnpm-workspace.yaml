packages:
  - "apps/*"
  - "packages/*"
overrides:
  vite: 8.2.4
  launch-editor: 2.14.2
  deepmerge-ts: 8.0.2
  fast-uri: 3.1.8
  proxy-addr: 2.0.8
  shell-quote: 1.11.0
  handlebars: 4.7.10
  undici: 8.10.2
  seroval: 1.6.11
  engine.io: 6.6.10
  dompurify: 3.4.16
  source-map-js: 1.2.2
  ip-address: 10.7.1
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  js-yaml: 4.3.2
  multer: 2.4.0
  nodemailer: 10.1.7
  qs: 6.16.0
allowBuilds:
  # bullmq's anonymous-usage telemetry postinstall ping - no functional need, denied.
  '@scarf/scarf': false
  # core-js postinstall only prints project funding information; runtime build is unnecessary.
  core-js: false
  # native msgpack encoder used by ioredis for faster (de)serialization.
  msgpackr-extract: true
  # native module resolver used by jest - real perf benefit, from Jest's own toolchain.
  unrs-resolver: true
