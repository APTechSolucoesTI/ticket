name: apticket

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Chat (Socket.IO) precisa que o Traefik roteie /socket.io/ pro container
    # `api` no MESMO domínio público do `web` (apticket.aptechinfo.com.br) —
    # o proxy same-origin do apps/web só cobre REST, não WebSocket. No
    # Dokploy normalmente isso se configura pela aba de domínios do projeto
    # (regra extra de path pro serviço `api`); se preferir declarar via
    # compose, descomente e ajuste `<traefik-network>`/`<router-name>` pro
    # que o Dokploy usa no host:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=<traefik-network>"
    #   - "traefik.http.routers.<router-name>-ws.rule=Host(`apticket.aptechinfo.com.br`) && PathPrefix(`/socket.io`)"
    #   - "traefik.http.routers.<router-name>-ws.entrypoints=websecure"
    #   - "traefik.http.routers.<router-name>-ws.tls=true"
    #   - "traefik.http.services.<router-name>-ws.loadbalancer.server.port=3001"

  # Debug do Redis (filas BullMQ, chaves de dedupe/presença/typing). Não
  # sobe por padrão — `docker compose --profile debug up` pra habilitar.
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles: ["debug"]

volumes:
  redis-data:
