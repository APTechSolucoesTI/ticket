Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogFile /tmp/clamd.log
LogFileMaxSize 2M
LogRotate yes
LogTime yes
LogClean no
LogVerbose no
MaxThreads 4
MaxQueue 8
MaxConnectionQueueLength 16
CommandReadTimeout 5
ReadTimeout 30
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxScanTime 30000
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
FailIfCvdOlderThan 7
ConcurrentDatabaseReload no
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes
